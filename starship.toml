# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Find Nerd font chars here:
# https://www.nerdfonts.com/cheat-sheet

format = """
[ 󰕈](bg:#a3aed2 fg:#090c0c)\
[](bg:#769ff0 fg:#a3aed2)\
$directory\
[](bg:#394260 fg:#769ff0)\
$git_branch\
$git_status\
[](bg:#212736 fg:#394260)\
$nodejs\
$rust\
$golang\
$php\
[](fg:#212736 bg:#1d2230)\
$time\
[ ](fg:#1d2230)\
\n$character"""

right_format = """
$cmd_duration\
"""

[directory]
style = "fg:#393e4d bg:#769ff0"
format = "[ $path ]($style)"
truncation_length = 10
truncation_symbol = "…/"
truncate_to_repo = false

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:#394260"
format = '[[ $symbol $branch ](fg:#769ff0 bg:#394260)]($style)'

# https://starship.rs/config/#git-status
[git_status]
ahead = '󰜷${count}'
diverged = '󰜷${ahead_count}󰜮${behind_count}'
behind = '󰜮${count}'
staged = '[${count}](fg:green bg:#394260)'
stashed = '📦'
modified = '📝'
style = "bg:#394260"
format = '[[($all_status$ahead_behind )](fg:#769ff0 bg:#394260)]($style)'

[nodejs]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[rust]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[golang]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[php]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[time]
disabled = true
time_format = "%R" # Hour:Minute Format
style = "bg:#1d2230"
format = '[[  $time ](fg:#a0a9cb bg:#1d2230)]($style)'

[cmd_duration]
min_time = 500
format = ' [$duration](bold yellow)'
